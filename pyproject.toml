[project]
name = "qduoj-cli"
version = "0.1.0"
description = "CLI for QingdaoU OnlineJudge"
readme = "README.md"
authors = [
    { name = "Yurin", email = "liyulin.china@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.14.3",
    "pydantic[all]>=2.13.5",
    "typer>=0.27.2",
]

[project.scripts]
qduoj-cli = "qduoj_cli:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
